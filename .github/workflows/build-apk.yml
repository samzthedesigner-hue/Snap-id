name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install
          npm install @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6 \
            @capacitor/local-notifications@6 @capacitor/device@6 \
            @capacitor/filesystem@6 @capacitor/camera@6

      - name: Setup Capacitor Android
        working-directory: frontend
        run: |
          npx cap add android || true
          npx cap copy android
          npx cap sync android

      - name: Patch Android Permissions
        working-directory: frontend/android/app/src/main
        run: |
          cat > patch.py << 'EOF'
          import pathlib
          p = pathlib.Path("AndroidManifest.xml")
          xml = p.read_text()
          perms = """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          """
          if "android.permission.INTERNET" not in xml:
              xml = xml.replace("<application", perms + "    <application", 1)
              p.write_text(xml)
              print("Permissions patched successfully.")
          else:
              print("Permissions already present.")
          EOF
          python3 patch.py

      - name: Build Debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare Release
        run: |
          mkdir -p out
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk out/SnapID.apk

      - name: Upload APK to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SnapID v1.0.${{ github.run_number }}
          files: out/SnapID.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
